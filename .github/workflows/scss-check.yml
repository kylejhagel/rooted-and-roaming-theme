name: Theme SCSS verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scss-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed stylesheet matches Sass output
        run: git diff --exit-code -- assets/css/theme.css
